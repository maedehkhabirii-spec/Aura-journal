<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Journal</title>
    <!-- آدرس صحیح فایل CSS در ریشه پروژه -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="auth-screen">
        <h1>AURA Journal</h1>
        <p>خاطراتت را زنده نگه دار.</p>
        <input type="email" id="email-input" placeholder="ایمیل">
        <input type="password" id="password-input" placeholder="رمز عبور">
        <button id="signin-btn">ورود</button>
        <button id="signup-btn">ساخت حساب</button>
        <button id="google-btn" style="background:#db4437; display:none;">ورود با گوگل</button>
        <p id="auth-error" hidden style="color: red; margin-top: 10px;"></p>
    </div>

    <div id="journal-screen" hidden>
        <header>
            <span id="user-label"></span>
            <button id="signout-btn" style="background:#ef4444;">خروج</button>
        </header>
        <main>
            <textarea id="page-content" placeholder="اینجا بنویس..." disabled></textarea>
            <span id="save-status">آماده</span>
        </main>
    </div>

    <!-- آدرس صحیح فایل‌های JS در ریشه پروژه -->
    <script type="module" src="journal.js"></script>
</body>
</html>
